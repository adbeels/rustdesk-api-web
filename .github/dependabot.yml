# Fork adbeels: avisos semanales de dependencias nuevas
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # message.ts se generó para protobufjs 7 (ver MANTENIMIENTO.md)
      - dependency-name: protobufjs
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
